name: DramaDub Facebook Cloud Render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique Job ID'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release Tag containing job_bundle.zip (optional)'
        required: false
        default: ''
        type: string
      video_url:
        description: 'Direct download URL for video (Douyin, Bilibili, YouTube, etc.)'
        required: false
        default: ''
        type: string
      speed_voice:
        description: 'Voice speed factor (default 1.3)'
        required: false
        default: '1.3'
        type: string
      slowdown:
        description: 'Compound final slowdown factor (default 0.8)'
        required: false
        default: '0.8'
        type: string
      orig_vol:
        description: 'Original Chinese audio volume (0.0 to 1.0, default 0.05)'
        required: false
        default: '0.05'
        type: string
      blur_box:
        description: 'Watermark blur coordinates x,y,w,h (default 410,15,305,55)'
        required: false
        default: '410,15,305,55'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  render:
    name: FB Dubbing & Render (${{ inputs.job_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk fonts-dejavu-core aria2
          ffmpeg -version

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-vieneu-${{ runner.os }}-v3turbo

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Job Bundle (if release_tag provided)
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p workspace/input workspace/output
          echo "Downloading bundle from release tag: ${{ inputs.release_tag }}"
          gh release download "${{ inputs.release_tag }}" -D workspace/input --pattern "*.zip"
          for z in workspace/input/*.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z..."
              unzip -q -o "$z" -d workspace/input/
            fi
          done
          echo "Files in workspace/input:"
          ls -la workspace/input/

      - name: Run FB Worker (TTS VieNeu + FFmpeg Compound Render)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python worker_fb.py \
            --job-id "${{ inputs.job_id }}" \
            --video-url "${{ inputs.video_url }}" \
            --speed-voice "${{ inputs.speed_voice }}" \
            --slowdown "${{ inputs.slowdown }}" \
            --orig-vol "${{ inputs.orig_vol }}" \
            --blur-box "${{ inputs.blur_box }}"

      - name: Upload Finished Facebook Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-render-result-${{ inputs.job_id }}
          path: |
            workspace/output/*.mp4
            workspace/output/*.srt
            workspace/output/job_summary.json
          retention-days: 3
          if-no-files-found: error
